name: E2E

on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/Cockpit.Simulator/**'
      - 'Cockpit.slnx'
      - 'global.json'
      - 'NuGet.Config'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - '.github/workflows/e2e.yml'
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/Cockpit.Simulator/**'
      - 'Cockpit.slnx'
      - 'global.json'
      - 'NuGet.Config'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COCKPIT_TEST_CONFIGURATION: Release
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use pinned npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - run: dotnet restore Cockpit.slnx --locked-mode
        working-directory: .
      - run: dotnet build Cockpit.slnx --configuration Release --no-restore
        working-directory: .
      # The existing config starts the loopback simulator with device control disabled.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() }}
        with:
          name: playwright-failure-artifacts
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

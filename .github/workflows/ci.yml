name: CI

on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/Cockpit.Simulator/**'
      - 'installation/**'
      - 'tools/test-systemd-unit.sh'
      - 'tools/test_update_installation.py'
      - 'Cockpit.slnx'
      - 'global.json'
      - 'NuGet.Config'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/Cockpit.Simulator/**'
      - 'installation/**'
      - 'tools/test-systemd-unit.sh'
      - 'tools/test_update_installation.py'
      - 'Cockpit.slnx'
      - 'global.json'
      - 'NuGet.Config'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater:
    name: Update scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m unittest discover -s tools -p test_update_installation.py -v

  runtime-lockfiles:
    name: Locked restore (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate installation runtime lockfiles
        run: dotnet publish src/Cockpit.Web/Cockpit.Web.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:RestoreLockedMode=true -p:NuGetLockFilePath=packages.${{ matrix.runtime }}.lock.json -m:1 -p:BuildInParallel=false

  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Cockpit.slnx --locked-mode
      - run: dotnet build Cockpit.slnx --configuration Release --no-restore
      - run: dotnet test tests/Unit/Cockpit.Unit.csproj --configuration Release --no-build --logger trx --results-directory TestResults/Unit
      - run: dotnet test tests/Integration/Cockpit.Integration.csproj --configuration Release --no-build --logger trx --results-directory TestResults/Integration
      - name: Validate generated Linux service with systemd
        run: sh tools/test-systemd-unit.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && !cancelled() }}
        with:
          name: backend-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Use pinned npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npm run build
      - run: npm run test:charts
      - run: npm run test:themes
      - run: npm run test:languages
